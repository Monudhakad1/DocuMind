plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.documind'
version = '0.0.1-SNAPSHOT'
description = 'DocuMind'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation 'dev.langchain4j:langchain4j'
    implementation 'dev.langchain4j:langchain4j-document-parser-apache-pdfbox'
    implementation 'org.apache.pdfbox:pdfbox:3.0.7'

    implementation 'dev.langchain4j:langchain4j-embeddings-all-minilm-l6-v2'


    // implementation 'dev.langchain4j:langchain4j-pgvector'

    implementation 'dev.langchain4j:langchain4j-google-ai-gemini'
    implementation 'dev.langchain4j:langchain4j-spring-boot-starter'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
dependencyManagement {
    imports {
        mavenBom 'dev.langchain4j:langchain4j-bom:1.17.2'
    }
}