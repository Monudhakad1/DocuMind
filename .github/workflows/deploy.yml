name: Deploy_Documind
on:
  push:
    branches:
      - main
env:
  IMAGE_NAME: documind

jobs:
    build-deploy:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout source
          uses: actions/checkout@v4

        - name: setup JDK 17
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: 17
            cache: gradle

#        - name: Grant execute permission
#          run: chmod +x gradlew

        - name: build jar
          run: ./gradlew build -x test

        - name: building docker image
          run: docker build -t ${{secrets.DOCKERHUB_USERNAME}}/${{env.IMAGE_NAME}}:latest .

        - name: login to dockerhub
          uses: docker/login-action@v4
          with:
            username: ${{secrets.DOCKERHUB_USERNAME}}
            password: ${{secrets.DOCKERHUB_TOKEN}}

        - name: push docker image
          run: docker push ${{secrets.DOCKERHUB_USERNAME}}/${{env.IMAGE_NAME}}:latest

        - name : Deploy to EC2
          uses: appleboy/ssh-action@v1.2.0
          with:
            host: ${{secrets.EC2_HOST}}
            username: ${{secrets.EC2_USER}}
            key: ${{secrets.EC2_KEY}}
            script: |
              docker pull ${{secrets.DOCKERHUB_USERNAME}}/${{env.IMAGE_NAME}}:latest
              docker stop documind || true
              docker rm documind || true
              docker run -d --name documind -e "api-key=${{secrets.API_KEY}}" --restart unless-stopped -p 8080:8080 ${{secrets.DOCKERHUB_USERNAME}}/${{env.IMAGE_NAME}}:latest     
              docker image prune -f